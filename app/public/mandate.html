<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reins — Mandate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">

<div class="wrap">
  <nav>
    <a class="brand" href="/">reins<b>.</b></a>
    <div class="nav-links">
      <a href="/">Strategies</a>
      <a href="/create.html">Create</a>
    </div>
    <div class="nav-right">
      <span class="net" id="net"><i></i>connecting…</span>
      <a class="btn quiet" id="explorer" href="#" target="_blank" rel="noopener" style="height:38px">Explorer ↗</a>
    </div>
  </nav>

  <div class="page-head">
    <h1 id="name">Reading the chain…</h1>
    <p class="sub">
      <span class="mono" id="addr"></span>
      <button class="copy" id="copy" type="button" hidden>copy</button>
      <span id="state"></span>
    </p>
  </div>

  <div class="stat-row" id="stats" hidden>
    <div><b id="s-equity">—</b><span>Equity</span></div>
    <div><b id="s-return">—</b><span>Since funding</span></div>
    <div><b id="s-funded">—</b><span>Funded</span></div>
    <div>
      <b id="s-floor">—</b><span id="s-headroom">Floor</span>
      <div class="meter"><i id="s-meter" style="width:0%"></i></div>
    </div>
  </div>

  <div class="grid two" style="margin-top:14px">
    <div class="card">
      <div class="head">Everything it has done <span>each line is a transaction</span></div>
      <div class="pad feed" id="feed"><p class="empty">Reading its history…</p></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="head">The rules <span>immutable</span></div>
        <dl class="pad rules-list" id="rules"></dl>
      </div>
      <div class="card">
        <div class="head">Holdings <span>where the money is, right now</span></div>
        <dl class="pad rules-list" id="holdings"></dl>
      </div>
    </div>
  </div>

  <footer>
    <span>Reins · read live from chain state</span>
    <span>Not investment advice</span>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var address = new URLSearchParams(location.search).get("a") || "";
  var cfg = null;

  var money = function (n) {
    return n === null || n === undefined
      ? "—"
      : "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  var short = function (a) { return a.slice(0, 10) + "…"; };

  function line(e) {
    if (e.event === "Traded")
      return ["ok", "traded " + e.sold.amount.toFixed(4) + " " + esc(e.sold.symbol) + " for " + e.bought.amount.toFixed(4) + " " + esc(e.bought.symbol)];
    if (e.event === "Frozen")
      return ["no", "hit the loss limit — " + money(e.equityUsd) + " against a " + money(e.floorUsd) + " floor, frozen"];
    if (e.event === "Deposited") return ["own", "owner added " + esc(e.amount) + " " + esc(e.symbol)];
    if (e.event === "Withdrawn") return ["own", "owner took out " + esc(e.amount) + " " + esc(e.symbol)];
    if (e.event === "AgentChanged") {
      var zero = /^0x0{40}$/i.test(e.agent);
      return ["own", zero ? "agent revoked by the owner" : "agent set to " + e.agent.slice(0, 8) + "…"];
    }
    return ["own", esc(e.event)];
  }

  function render(d) {
    $("name").textContent = d.name || "unnamed mandate";
    $("addr").textContent = address;
    $("copy").hidden = false;

    var st = d.closed ? ["closed", "Closed"] : d.frozen ? ["frozen", "Frozen"] : d.expired ? ["expired", "Expired"] : ["live", "Live"];
    $("state").innerHTML = ' &nbsp;<span class="pill ' + st[0] + '">' + st[1] + "</span>";

    $("stats").hidden = false;
    $("s-equity").textContent = money(d.equityUsd);
    var r = d.returnPct;
    $("s-return").textContent = r === null || r === undefined ? "—" : (r > 0 ? "+" : "") + r.toFixed(2) + "%";
    $("s-return").className = r === null || r === undefined || Math.abs(r) < 0.005 ? "" : r > 0 ? "up" : "down";
    $("s-funded").textContent = money(d.baselineUsd);
    $("s-floor").textContent = money(d.floorUsd);
    var headroom = d.equityUsd != null && d.floorUsd != null ? Math.max(0, d.equityUsd - d.floorUsd) : null;
    $("s-headroom").textContent = headroom === null ? "Floor" : "Floor · " + money(headroom) + " of headroom";
    var span = d.baselineUsd - d.floorUsd;
    $("s-meter").style.width = headroom === null || span <= 0 ? "0%" : Math.max(2, Math.min(100, (headroom / span) * 100)) + "%";

    var rules = d.rules || {};
    $("rules").innerHTML =
      "<div><dt>Per trade</dt><dd>at most " + money(rules.maxTradeUsd) + "</dd></div>" +
      "<div><dt>Loss limit</dt><dd>−" + rules.maxLossPercent + "%, then freeze</dd></div>" +
      "<div><dt>Price bound</dt><dd>within " + rules.maxSlippagePercent + "% of the oracle</dd></div>" +
      "<div><dt>May trade</dt><dd>" + (rules.allowedAssets || []).map(esc).join(" · ") + "</dd></div>" +
      "<div><dt>Expires</dt><dd>" + new Date(d.expiresAt).toLocaleDateString() + "</dd></div>" +
      "<div><dt>Can withdraw</dt><dd>only the owner, any time</dd></div>";

    $("holdings").innerHTML =
      (d.holdings || [])
        .filter(function (h) { return h.amount > 0; })
        .map(function (h) {
          return "<div><dt>" + esc(h.symbol) + "</dt><dd>" + h.amount.toFixed(4) +
            (h.valueUsd != null ? ' <span class="dim">· ' + money(h.valueUsd) + "</span>" : "") + "</dd></div>";
        })
        .join("") || '<div><dt>Empty</dt><dd>nothing held</dd></div>';

    var hist = d.history || [];
    $("feed").innerHTML = hist.length
      ? hist.map(function (e) {
          var l = line(e);
          return '<div><span class="chip ' + l[0] + '">' + (l[0] === "no" ? "stop" : l[0] === "ok" ? "trade" : "owner") + "</span>" +
            '<span class="grow">' + l[1] + "</span>" +
            '<a href="' + cfg.explorer + "/tx/" + e.tx + '" target="_blank" rel="noopener">' + short(e.tx) + " ↗</a></div>";
        }).join("")
      : '<p class="empty">Quiet so far — no activity yet.</p>';
  }

  function tick() {
    fetch("/api/mandate/" + address)
      .then(function (r) {
        if (!r.ok) throw new Error("bad address");
        return r.json();
      })
      .then(render)
      .catch(function () {
        $("name").textContent = "Couldn't read that mandate";
        $("feed").innerHTML = '<p class="empty">Check the address, or try again shortly.</p>';
      });
  }

  $("copy").addEventListener("click", function () {
    navigator.clipboard.writeText(address).then(
      function () { $("copy").textContent = "copied"; setTimeout(function () { $("copy").textContent = "copy"; }, 1200); },
      function () {}
    );
  });

  if (!/^0x[0-9a-fA-F]{40}$/.test(address)) {
    $("name").textContent = "No mandate given";
    $("feed").innerHTML = '<p class="empty">Open this page from the strategies list.</p>';
  } else {
    fetch("/api/config")
      .then(function (r) { return r.json(); })
      .then(function (c) {
        cfg = c;
        $("net").innerHTML = "<i></i>Arc " + esc(c.network);
        $("explorer").href = c.explorer + "/address/" + address;
        tick();
        setInterval(tick, 15000);
      });
  }
})();
</script>
</html>
